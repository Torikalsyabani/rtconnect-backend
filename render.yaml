services:
  - type: web
    name: rtconnect-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 -b 0.0.0.0:$PORT server:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: rtconnect-db
          property: connectionString

databases:
  - name: rtconnect-db
    plan: free
